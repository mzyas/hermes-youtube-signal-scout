name: hermes-youtube-signal-scout
version: 0.4.3
description: >
  Discover, hydrate, filter, and rank YouTube videos for a topic, keyword group,
  tag set, channel pool, and time window using YouTube Data API v3.
runtime:
  language: python
  entrypoint: tools/runner.py
interfaces:
  weekly:
    python_api: tools.weekly_runner.run_weekly
    cli: python -m tools.weekly_runner --config <yaml|json>
secrets:
  - YOUTUBE_API_KEY
defaults:
  mode: discovery
  zones:
    - east_asia
    - europe
    - north_america
  region_code: null
  region_codes: []
  region_priority_tiers:
    - [US, JP, HK, GB]
    - [KR, TW, DE, FR, CA]
  relevance_language: null
  localized_queries: {}
  order: date
  lookback_days: 7
  max_results: 10
  target_results: 10
  max_videos_per_channel: 1
  max_search_pages: 1
  adaptive_max_search_pages: 1
  min_views: 0
  max_duration_seconds: 3600
  include_shorts: false
  topic_score_threshold: 0.45
  engagement_prior_views: 1000
  channel_quality_scores: {}
  output_dir: null
  cache_enabled: true
  cache_path: null
  retry_attempts: 2
  retry_backoff_seconds: 1.0
  timeout_seconds: 30
  shorts_max_duration_seconds: 60
  reject_possible_ads: true
  reject_entertainment: true
  reject_exam_training: true
  blocked_exam_training_channel_names:
    - Vajiram and Ravi
    - Drishti IAS
    - Vision IAS
    - StudyIQ IAS
    - PW OnlyIAS
    - NEXT IAS
    - InsightsIAS
    - ForumIAS
    - Shankar IAS Academy
    - Rau's IAS Study Circle
    - Unacademy UPSC
    - BYJU'S IAS
    - Adda247
    - Testbook
    - 資格の学校TAC
    - LEC東京リーガルマインド
    - アガルート
    - クレアール
    - 公務員試験予備校EYE
    - スタディング
    - 공단기
    - 메가공무원
    - 해커스공무원
    - 에듀윌 공무원
    - 박문각 공무원
    - 中公教育
    - 华图教育
    - 華圖教育
    - 粉笔公考
    - 粉筆公考
    - 粉笔教育
    - 粉筆教育
quota_policy:
  max_search_pages_per_run: 1
  max_videos_per_hydration_batch: 50
  search_cache_ttl_hours: 6
  video_cache_ttl_hours: 24
  channel_uploads_cache_ttl_hours: 3
  prefer_channel_watch_after_first_run: true
