interface:
  display_name: "Hermes YouTube Signal Scout"
  short_description: "Find and rank YouTube video signals for Hermes workflows."
  default_prompt: "Use $hermes-youtube-signal-scout to find and rank YouTube videos for this topic. Preserve the user's exact topic wording when asking for clarification. Build localized_queries that express the same intent in each target region's language without broadening or narrowing it. Return result.report_markdown verbatim by default, or the complete result.report_json when JSON is requested, with no additional prose. Only after an explicit weekly run via run_weekly, pass email_handoff.mml_template unchanged on standard input to himalaya --account <account> template send using email_handoff.account. Honor retry_policy never_automatic: on a non-zero Himalaya exit, report indeterminate delivery and do not retry without explicit user approval after checking Sent mail. Never generate or send email for a normal run result."
